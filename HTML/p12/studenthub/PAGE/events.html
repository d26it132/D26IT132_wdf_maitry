
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Events</title>

    <link rel="stylesheet" href="../CSS/events.css">
</head>

<body>

<header>
    <nav class="navbar" aria-label="Main navigation">

        <a href="index.html" class="logo-link">
            <img src="../IMAGES/charusat_logo.jpg"
                 alt="StudentHub Logo"
                 class="logo-image">
            <span class="logo-text">StudentHub</span>
        </a>

        <button id="menuButton"
                class="hamburger"
                type="button"
                aria-expanded="false"
                aria-controls="navigationMenu"
                aria-label="Open navigation menu">
            ☰
        </button>

        <ul id="navigationMenu" class="navigation-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="events.html" aria-current="page">Events</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>

    </nav>
</header>

<main id="main-content">

    
<section class="events-section">
    <div class="events-heading">
        <h1>Upcoming Events</h1>
        <p>
            Explore exciting activities, competitions, and opportunities
            happening at StudentHub.
        </p>
    </div>

    <!-- Search and category filters -->
    <div class="event-filters">
        <input
            type="text"
            id="searchEvent"
            placeholder="Search events by name, venue, or category..."
            aria-label="Search events"
        >

        <select id="categoryFilter" aria-label="Filter events by category">
            <option value="All">All Categories</option>
            <option value="Workshop">Workshop</option>
            <option value="Innovation">Innovation</option>
            <option value="Sports">Sports</option>
            <option value="Cultural">Cultural</option>
            <option value="Creativity">Creativity</option>
            <option value="Career">Career</option>
            <option value="Social">Social</option>
            <option value="Student Life">Student Life</option>
        </select>
    </div>

    <p id="eventCount" aria-live="polite">Loading events...</p>

    <!-- JavaScript inserts event cards here -->
    <div class="events-container" id="eventsContainer"></div>
</section>


</main>

<footer>
    <p>&copy; 2026 StudentHub | Your Campus, Your Community</p>
</footer>

<script src="../JS/events.js"></script>

</body>
</html>
