<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Contact</title>
    <link rel="stylesheet" href="../CSS/contact.css">
</head>

<body>

<header>
     <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="logo-link">
                <img src="../IMAGES/charusat_logo.jpg" alt="StudentHub Logo" class="logo-image">
                <span class="logo-text">StudentHub</span>
            </a>

            <button id="menuButton" class="hamburger" type="button" aria-expanded="false" aria-label="Open navigation menu">
                ☰
            </button>

            <ul id="navigationMenu" class="navigation-menu">
                <li><a href="index.html" aria-current="page">Home</a></li>
                <li><a href="about.html" >About</a></li>
                <li><a href="events.html" >Events</a></li>
                <li><a href="faq.html" >FAQ</a></li>
                <li><a href="login.html" >Login</a></li>
                <li><a href="register.html" >Register</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
</header>

<main>

<section>
    <h2>Contact StudentHub</h2>

    <form>

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <button type="submit">Send Message</button>

    </form>
</section>

<aside>
    <h2>Contact Information</h2>
    <p>Email: support@studenthub.com</p>
    <p>Phone: +91 98765 43210</p>
</aside>

</main>

<footer>
    <p>&copy; 2026 StudentHub</p>
</footer>

<script src="../JS/contact.js"></script>

</body>
</html>
